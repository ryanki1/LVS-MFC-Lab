services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lvslab
      POSTGRES_USER: ${DB_USER:?Copy .env.example to .env and set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  wildfly:
    build:
      context: .
      dockerfile: deploy/wildfly/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:?Copy .env.example to .env and set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "8080:8080"
      - "9990:9990"
